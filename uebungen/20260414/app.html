<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="app.js" defer></script>
    <link rel="stylesheet" href="todo.css">
    <title>Titel</title>
  </head>
  <body>
    <main>
            <fieldset>
                <legend>Transaktion</legend>
                <label for="betragInput">Betrag</label>
                <input id="betragInput" type="text", placeholder="Betrag"></input>
                <fieldset>
                    <legend>Einnahme/Ausgabe</legend>
                    <div>
                        <label class="inline">Einnahme</label>
                        <input type="radio" value="einnahme" name="typeInput" selected></input>
                    </div>
                    <div>
                        <label>Ausgabe</label>
                        <input type="radio" value="ausgabe" name="typeInput"></input>
                    </div>
                </fieldset>
            </fieldset>
    </main>
  </body>
</html>
